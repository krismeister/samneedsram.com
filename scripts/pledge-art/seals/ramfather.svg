<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<!-- RAMfather RESPECT seal motif. Rings + rose petals + RAM pin ticks only,
     no text: the template overlays the word RESPECT in HTML. Transparent bg.
     Center (r < 150) stays empty for the word. -->
<g fill="none" stroke="#b3121f">
<circle cx="256" cy="256" r="238" stroke-width="15" stroke-dasharray="150 12 60 12 150 12 60 12"/>
<circle cx="256" cy="256" r="198" stroke-width="6"/>
<circle cx="256" cy="256" r="150" stroke-width="2" opacity="0.6"/>
</g>
<!-- twelve rose petals floating in the mid band (r 202-228) -->
<g fill="#b3121f">
<ellipse cx="256" cy="41" rx="11" ry="13"/>
<ellipse cx="256" cy="41" rx="11" ry="13" transform="rotate(30 256 256)"/>
<ellipse cx="256" cy="41" rx="11" ry="13" transform="rotate(60 256 256)"/>
<ellipse cx="256" cy="41" rx="11" ry="13" transform="rotate(90 256 256)"/>
<ellipse cx="256" cy="41" rx="11" ry="13" transform="rotate(120 256 256)"/>
<ellipse cx="256" cy="41" rx="11" ry="13" transform="rotate(150 256 256)"/>
<ellipse cx="256" cy="41" rx="11" ry="13" transform="rotate(180 256 256)"/>
<ellipse cx="256" cy="41" rx="11" ry="13" transform="rotate(210 256 256)"/>
<ellipse cx="256" cy="41" rx="11" ry="13" transform="rotate(240 256 256)"/>
<ellipse cx="256" cy="41" rx="11" ry="13" transform="rotate(270 256 256)"/>
<ellipse cx="256" cy="41" rx="11" ry="13" transform="rotate(300 256 256)"/>
<ellipse cx="256" cy="41" rx="11" ry="13" transform="rotate(330 256 256)"/>
</g>
<!-- RAM gold-pin ticks between the petals -->
<g fill="#d8a93e">
<rect x="251.5" y="30" width="9" height="22" transform="rotate(15 256 256)"/>
<rect x="251.5" y="30" width="9" height="22" transform="rotate(45 256 256)"/>
<rect x="251.5" y="30" width="9" height="22" transform="rotate(75 256 256)"/>
<rect x="251.5" y="30" width="9" height="22" transform="rotate(105 256 256)"/>
<rect x="251.5" y="30" width="9" height="22" transform="rotate(135 256 256)"/>
<rect x="251.5" y="30" width="9" height="22" transform="rotate(165 256 256)"/>
<rect x="251.5" y="30" width="9" height="22" transform="rotate(195 256 256)"/>
<rect x="251.5" y="30" width="9" height="22" transform="rotate(225 256 256)"/>
<rect x="251.5" y="30" width="9" height="22" transform="rotate(255 256 256)"/>
<rect x="251.5" y="30" width="9" height="22" transform="rotate(285 256 256)"/>
<rect x="251.5" y="30" width="9" height="22" transform="rotate(315 256 256)"/>
<rect x="251.5" y="30" width="9" height="22" transform="rotate(345 256 256)"/>
</g>
<!-- diagonal registration diamonds -->
<g fill="#f2e9d8">
<path d="M399 113 l13 13 -13 13 -13 -13 Z"/>
<path d="M113 113 l13 13 -13 13 -13 -13 Z"/>
<path d="M399 373 l13 13 -13 13 -13 -13 Z"/>
<path d="M113 373 l13 13 -13 13 -13 -13 Z"/>
</g>
</svg>
