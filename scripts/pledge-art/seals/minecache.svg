<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<!-- MineCache seal: grass-green double ring, dirt-brown inner ring,
     pickaxe glyph in the top band, RAM-stick glyph in the bottom band,
     diamond studs in the side bands. Center stays transparent: the
     template overlays the word DIAMONDS in HTML. No text in this file. -->
<g fill="none" stroke="#5cb531">
<circle cx="256" cy="256" r="238" stroke-width="12"/>
<circle cx="256" cy="256" r="214" stroke-width="4"/>
</g>
<g fill="none" stroke="#8a5a2b" stroke-width="6">
<circle cx="256" cy="256" r="150"/>
</g>
<!-- pickaxe, top band -->
<g stroke-linecap="round">
<line x1="238" y1="104" x2="272" y2="58" stroke="#c98f4a" stroke-width="11"/>
<path d="M212 82 Q248 44 298 62" fill="none" stroke="#4de3e3" stroke-width="11"/>
<path d="M212 82 l-12 2 8 10 Z" fill="#4de3e3"/>
<path d="M298 62 l11 -5 1 13 Z" fill="#4de3e3"/>
</g>
<!-- RAM stick, bottom band -->
<g fill="none" stroke="#5cb531" stroke-width="6">
<rect x="186" y="416" width="140" height="30" rx="4"/>
</g>
<g stroke="#e8b93c" stroke-width="4">
<line x1="200" y1="446" x2="200" y2="456"/>
<line x1="214" y1="446" x2="214" y2="456"/>
<line x1="228" y1="446" x2="228" y2="456"/>
<line x1="242" y1="446" x2="242" y2="456"/>
<line x1="256" y1="446" x2="256" y2="456"/>
<line x1="270" y1="446" x2="270" y2="456"/>
<line x1="284" y1="446" x2="284" y2="456"/>
<line x1="298" y1="446" x2="298" y2="456"/>
<line x1="312" y1="446" x2="312" y2="456"/>
</g>
<g fill="#1d3a1d">
<rect x="196" y="422" width="26" height="18"/>
<rect x="243" y="422" width="26" height="18"/>
<rect x="290" y="422" width="26" height="18"/>
</g>
<!-- diamond studs, side bands -->
<g fill="#4de3e3">
<path d="M74 232 l20 24 -20 24 -20 -24 Z"/>
<path d="M438 232 l20 24 -20 24 -20 -24 Z"/>
</g>
<g fill="#bffcff" opacity="0.7">
<path d="M74 232 l20 24 h-40 Z"/>
<path d="M438 232 l20 24 h-40 Z"/>
</g>
</svg>
