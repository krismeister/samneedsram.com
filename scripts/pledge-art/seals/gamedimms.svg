<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<!-- Game of DIMMs seal: ice-blue double ring, RAM-sword glyph top,
     circuit-diamond glyph bottom. Center stays transparent: template
     overlays "WINTER". -->
<g fill="none" stroke="#4fa8e8">
<circle cx="256" cy="256" r="238" stroke-width="10"/>
<circle cx="256" cy="256" r="150" stroke-width="5"/>
</g>
<!-- RAM sword, tip up, above center -->
<g stroke="#4fa8e8" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
<path d="M256 34 L272 62 L272 118 L240 118 L240 62 Z"/>
<line x1="228" y1="132" x2="284" y2="132"/>
<line x1="256" y1="132" x2="256" y2="148"/>
</g>
<g fill="#4fa8e8">
<rect x="248" y="70" width="16" height="10"/>
<rect x="248" y="88" width="16" height="10"/>
<rect x="248" y="106" width="16" height="8"/>
</g>
<!-- circuit diamonds, below center -->
<g fill="none" stroke="#4fa8e8" stroke-width="6">
<path d="M256 380 l22 22 -22 22 -22 -22 Z"/>
</g>
<g fill="#4fa8e8">
<circle cx="196" cy="410" r="6"/>
<circle cx="316" cy="410" r="6"/>
<rect x="248" y="394" width="16" height="16"/>
</g>
<g stroke="#4fa8e8" stroke-width="4">
<line x1="202" y1="410" x2="228" y2="410"/>
<line x1="284" y1="410" x2="310" y2="410"/>
</g>
</svg>
