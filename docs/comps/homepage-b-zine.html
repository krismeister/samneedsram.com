<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>samneedsram.com — Sam's out of memory. Help him remember.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2ecdd;
    --paper-2: #e9e0c9;
    --ink: #16130e;
    --red: #d92b1f;
    --yellow: #ffc81a;
    --blue: #2456c8;
    --tape: rgba(233, 224, 190, 0.85);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: "Special Elite", "Courier New", monospace;
    background-color: var(--paper);
    background-image: radial-gradient(rgba(22, 19, 14, 0.10) 1px, transparent 1.6px);
    background-size: 12px 12px;
    overflow-x: hidden;
  }
  .wrap { max-width: 62rem; margin: 0 auto; padding: 1rem 1.25rem 3rem; }
  #flares { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

  /* ---------- masthead ---------- */
  .masthead { position: relative; padding-top: 1rem; }
  .stamp-row { display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
  .stamp {
    display: inline-block;
    border: 3px double var(--ink);
    padding: 0.3rem 0.7rem;
    font-size: 0.85rem;
    text-transform: uppercase;
    transform: rotate(-2deg);
    background: var(--paper);
  }
  .site-stamp {
    font-family: Anton, Impact, sans-serif;
    font-size: clamp(1rem, 3vw, 1.5rem);
    letter-spacing: 0.02em;
    border: 4px solid var(--ink);
    padding: 0.15rem 0.8rem;
    transform: rotate(1.5deg);
    background: var(--ink);
    color: var(--paper);
  }
  h1 {
    font-family: Anton, Impact, sans-serif;
    font-size: clamp(3.2rem, 13vw, 8.5rem);
    line-height: 0.92;
    text-transform: uppercase;
    margin: 1rem 0 0.5rem;
    transform: rotate(-1.2deg);
    text-shadow: 4px 4px 0 var(--red);
  }
  .starburst {
    position: absolute;
    top: 2.2rem;
    right: 0.5rem;
    width: 9.5rem;
    height: 9.5rem;
    display: grid;
    place-items: center;
    text-align: center;
    background: var(--red);
    color: var(--paper);
    font-family: Anton, Impact, sans-serif;
    font-size: 1.35rem;
    line-height: 1.05;
    text-transform: uppercase;
    padding: 1.4rem;
    transform: rotate(11deg);
    clip-path: polygon(50% 0%, 61% 12%, 75% 6%, 79% 20%, 93% 19%, 90% 33%, 100% 40%, 93% 52%, 99% 64%, 87% 69%, 87% 83%, 74% 82%, 68% 95%, 57% 87%, 47% 97%, 40% 85%, 27% 90%, 25% 77%, 12% 77%, 14% 64%, 2% 57%, 9% 46%, 2% 35%, 14% 30%, 14% 16%, 26% 17%, 32% 5%, 43% 12%);
  }
  .sub {
    font-size: clamp(1rem, 2.6vw, 1.3rem);
    max-width: 42rem;
    transform: rotate(-0.6deg);
  }
  .sub strong { background: var(--yellow); padding: 0 0.25em; }

  /* ---------- counter board ---------- */
  .counter-board {
    margin: 1.5rem 0;
    background: var(--ink);
    color: var(--paper);
    padding: 1rem 1.25rem 1.2rem;
    transform: rotate(0.8deg);
    box-shadow: 8px 8px 0 rgba(22, 19, 14, 0.25);
    position: relative;
  }
  .counter-board::before, .counter-board::after {
    content: "";
    position: absolute;
    top: -0.9rem;
    width: 5rem;
    height: 1.6rem;
    background: var(--tape);
    border-left: 1px dashed rgba(0,0,0,0.25);
    border-right: 1px dashed rgba(0,0,0,0.25);
  }
  .counter-board::before { left: 8%; transform: rotate(-6deg); }
  .counter-board::after { right: 8%; transform: rotate(5deg); }
  .counter-label { color: var(--yellow); text-transform: uppercase; font-size: 0.9rem; letter-spacing: 0.12em; }
  .counter-number {
    font-family: Anton, Impact, sans-serif;
    font-size: clamp(2.6rem, 9vw, 5rem);
    line-height: 1;
    margin: 0.2rem 0;
  }
  .counter-sub { font-size: 0.95rem; }
  .counter-sub .tally { color: var(--yellow); }

  /* ---------- sticker buttons ---------- */
  .cta-row { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1.5rem 0 0.5rem; }
  .btn {
    font-family: Anton, Impact, sans-serif;
    text-transform: uppercase;
    font-size: clamp(1.2rem, 4vw, 1.8rem);
    letter-spacing: 0.02em;
    padding: 0.55rem 1.4rem 0.45rem;
    border: 4px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--ink); }
  .btn-red { background: var(--red); color: var(--paper); transform: rotate(-1.5deg); }
  .btn-yellow { background: var(--yellow); color: var(--ink); transform: rotate(1deg); }
  .btn-small { font-size: 1rem; padding: 0.35rem 0.9rem; border-width: 3px; box-shadow: 4px 4px 0 var(--ink); }

  /* ---------- feed ---------- */
  .section-title {
    font-family: Anton, Impact, sans-serif;
    text-transform: uppercase;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    margin: 2.5rem 0 0.25rem;
    transform: rotate(-0.8deg);
    display: inline-block;
    background: var(--ink);
    color: var(--paper);
    padding: 0.1rem 0.8rem;
  }
  .section-note { font-family: "Permanent Marker", cursive; color: var(--red); font-size: 1.05rem; margin: 0.4rem 0 1rem 0.4rem; transform: rotate(-1deg); }
  .feed { list-style: none; margin: 0; padding: 0.5rem 0 0; display: grid; gap: 0.9rem; }
  .slip {
    position: relative;
    background: #fbf7ea;
    border: 2px solid var(--ink);
    padding: 0.7rem 1rem 0.7rem 3.2rem;
    box-shadow: 5px 5px 0 rgba(22, 19, 14, 0.2);
    font-size: 1.02rem;
  }
  .slip:nth-child(odd) { transform: rotate(-0.7deg); }
  .slip:nth-child(even) { transform: rotate(0.6deg); margin-left: 1.2rem; }
  .slip::before {
    content: "";
    position: absolute;
    top: -0.8rem;
    left: 40%;
    width: 4.5rem;
    height: 1.4rem;
    background: var(--tape);
    transform: rotate(-3deg);
    border-left: 1px dashed rgba(0,0,0,0.25);
    border-right: 1px dashed rgba(0,0,0,0.25);
  }
  .slip .pin {
    position: absolute;
    left: 0.7rem;
    top: 50%;
    translate: 0 -50%;
    font-family: Anton, Impact, sans-serif;
    background: var(--red);
    color: var(--paper);
    font-size: 0.8rem;
    padding: 0.2rem 0.4rem;
    transform: rotate(-4deg);
  }
  .slip .who { font-weight: bold; }
  .slip .time { float: right; font-size: 0.8rem; opacity: 0.7; }
  .slip.fresh { animation: slip-in 0.45s ease-out; }
  @keyframes slip-in {
    0% { transform: translateY(-14px) rotate(2deg) scale(1.03); background: var(--yellow); }
    100% { transform: translateY(0) rotate(-0.7deg) scale(1); }
  }
